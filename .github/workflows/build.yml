name: Build and push php-nginx images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php_version: 8.5.3-fpm-alpine3.23
            tag: "8.5"
            latest: true
          - php_version: 8.3.15-fpm-alpine3.21
            tag: "8.3"
            latest: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
          push: true
          tags: |
            ghcr.io/tiborasandor/php-nginx:${{ matrix.tag }}
            ghcr.io/tiborasandor/php-nginx:${{ matrix.tag }}-${{ github.sha }}

      - name: Also tag as latest
        if: matrix.latest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/tiborasandor/php-nginx:latest \
            ghcr.io/tiborasandor/php-nginx:${{ matrix.tag }}
